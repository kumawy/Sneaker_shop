name: sneaker_store
description: "SneakerStore – Assignment 8 ..."
publish_to: 'none'
version: 8.0.0+8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  go_router: ^17.2.3
  provider: ^6.1.2
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  json_annotation: ^4.8.1
  http: ^1.1.0

  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.2
  path: ^1.9.0

  # Keep Firebase plugins aligned on iOS SDK 12.15.0 for SPM.
  firebase_core: 4.12.1
  firebase_auth: 6.5.6
  cloud_firestore: 6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.7.1
  riverpod_generator: ^4.0.3
  drift_dev: ^2.18.0
  test: ^1.24.3
  mockito: ^5.4.2
  golden_toolkit: ^0.15.0
  fake_cloud_firestore: ^4.3.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/splash/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon/app_icon.png
  android: true
  ios: true
